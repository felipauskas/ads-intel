# Schema: NousResearch/hermes-agent plugin-catalog entry
#   keys      -> scripts/validate_plugin_catalog.py (KNOWN_KEYS / REQUIRED_KEYS)
#   semantics -> hermes_cli/plugin_catalog.py (PluginCatalogEntry) + plugin-catalog/README.md
# Published 2026-11-09 at https://github.com/felipauskas/ads-intel (public,
# cloneable, owner felipauskas). sha pins the published commit below; bump
# sha + version together on each release, then re-run
# `hermes plugins validate .` on that exact tree.
#   * there is deliberately no license field: the loader has none and would warn on an
#     unknown top-level key. License lives in plugin.yaml (MIT).
name: ads-intel
title: Ads Intel
repo: https://github.com/felipauskas/ads-intel
sha: 02e068553b2d4a0973177400b425f1b06ca5b294
version: "0.3.0"
description: "Search the public Meta Ad Library by keyword or by numeric Meta Page ID (page_id → search_type=page&view_all_page_id=, with country as a separate delivery axis) and watch competitor pages for new, ended and changed ads through three tools (ad_search, ad_watch, ad_check), with local snapshot diffing and HTML/JSON reports. Stdlib Python only, zero API keys, no accounts, no credentials. Disclosure - network: one read-only GET per query to https://www.facebook.com/ads/library/ performed by Hermes' built-in web_extract in the normal case (up to 6 attempts only when a render fails to parse, each retry cache-busted, inside a 60-second wall-clock cap), no other hosts, no idle traffic, no pagination; filesystem: writes only inside plugin_data_dir('ads-intel') (watchlist.json, snapshots/, reports/) and reads nothing outside it; no shell commands, no background processes, no stored secrets or environment variables. Meta's terms do not authorise automated collection and this plugin does not claim that authorisation: it is a low-rate read-only client intended for personal, small-scale research, and the user is responsible for their own use."
maintainer: felipauskas
tier: community
category: tools
requires_hermes: ">=0.21.5"
platforms: []
capabilities:
  provides_tools:
    - ad_search
    - ad_watch
    - ad_check
  provides_hooks: []
  provides_middleware: []
  requires_env: []
