name: ads-intel
title: Ads Intel
repo: https://github.com/felipauskas/ads-intel
sha: 66799914c816a360f5777f12bffda251d57c5a82
version: "0.2.0"
description: "Search the public Meta Ad Library and watch competitor pages for new, ended and changed ads through three tools (ad_search, ad_watch, ad_check), with local snapshot diffing and HTML/JSON reports. Stdlib Python only, zero API keys, no accounts, no credentials. Disclosure - network: one read-only GET per query to https://www.facebook.com/ads/library/ performed by Hermes' built-in web_extract in the normal case (up to 6 attempts only when a render fails to parse, each retry cache-busted, inside a 60-second wall-clock cap), no other hosts, no idle traffic, no pagination; filesystem: writes only inside plugin_data_dir('ads-intel') (watchlist.json, snapshots/, reports/) and reads nothing outside it; no shell commands, no background processes, no stored secrets or environment variables. Meta's terms do not authorise automated collection and this plugin does not claim that authorisation: it is a low-rate read-only client intended for personal, small-scale research, and the user is responsible for their own use."
maintainer: felipauskas
tier: community
category: tools
requires_hermes: ">=0.21.5"
platforms: []
capabilities:
  provides_tools:
    - ad_search
    - ad_watch
    - ad_check
  provides_hooks: []
  provides_middleware: []
  requires_env: []
